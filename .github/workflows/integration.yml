name: Integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      # espeak-ng phonemises prompts (phonemes.py); the tests run the real program, so every runner installs it.
      - name: Install espeak-ng
        if: runner.os != 'Windows'
        run: if [ "$RUNNER_OS" = macOS ]; then brew install espeak-ng; else sudo apt-get update -q && sudo apt-get install -y -q espeak-ng; fi
      - name: Install espeak-ng (Windows, the project's MSI)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo espeak-ng/espeak-ng --pattern '*.msi' --dir "$env:RUNNER_TEMP\espeak"
          $msi = Get-ChildItem "$env:RUNNER_TEMP\espeak\*.msi" | Sort-Object { $_.Name -notmatch 'x64' } | Select-Object -First 1
          Start-Process msiexec.exe -Wait -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn'
          "C:\Program Files\eSpeak NG" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: uv sync --locked
      - name: Integration tests (CLI and HTTP API end-to-end)
        run: uv run pytest tests/integration -n auto --durations=10

  audit:
    name: Dependency audit (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv audit --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:integration
