<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>strata-voice</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70}

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}

<h1>strata-voice</h1>
<p>The recording studio is the web app, which has not been built here yet: <code>cd web &amp;&amp; npm ci &amp;&amp; npm run build</code>, then reload.</p>
<p class="mut" id="status"></p>
</main><script>
fetch("api/studio").then(r=>r.json()).then(s=>{document.getElementById('status').textContent=
 `Server is up. ${s.progress.recorded} of ${s.progress.prompts} prompts recorded so far.`}).catch(()=>{})
</script></body></html>
